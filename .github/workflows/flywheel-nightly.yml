name: PR Flywheel - Nightly Babysitter

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering for testing

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  find-stuck-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FLYWHEEL_APP_ID }}
          private-key: ${{ secrets.FLYWHEEL_APP_KEY }}

      - name: Find and re-trigger stuck PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Searching for stuck PRs with the 'flywheel' label..."

          # Calculate timestamp for 24 hours ago
          cutoff_time=$(date -u -d '24 hours ago' --iso-8601=seconds 2>/dev/null || date -u -v-24H "+%Y-%m-%dT%H:%M:%SZ")

          # Find all open PRs with the 'flywheel' label
          prs=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --label flywheel \
            --json number,updatedAt,headRefName \
            --jq '.[]')

          if [[ -z "$prs" ]]; then
            echo "No open PRs with 'flywheel' label found."
            exit 0
          fi

          # Process each PR
          echo "$prs" | jq -c '.' | while read -r pr; do
            pr_number=$(echo "$pr" | jq -r '.number')
            updated_at=$(echo "$pr" | jq -r '.updatedAt')
            head_ref=$(echo "$pr" | jq -r '.headRefName')

            # Check if PR is older than 24 hours
            if [[ "$updated_at" < "$cutoff_time" ]]; then
              echo "PR #${pr_number} is older than 24 hours (last updated: ${updated_at})"

              # Check for recent flywheel check runs
              recent_checks=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/$REPO/commits/${head_ref}/check-runs" \
                --jq "[.check_runs[] | select(.name == \"flywheel\" and .started_at > \"${cutoff_time}\")] | length")

              if [[ "$recent_checks" -eq 0 ]]; then
                echo "  ⚠️  No recent flywheel activity detected. Re-triggering workflow..."

                # Get the workflow ID for the flywheel-caller workflow
                # Try to find workflow by name
                workflow_id=$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "/repos/$REPO/actions/workflows" \
                  --jq '.workflows[] | select(.name == "PR Flywheel" or .path | contains("flywheel")) | .id' \
                  | head -1)

                if [[ -n "$workflow_id" ]]; then
                  # Trigger the workflow for this PR's branch
                  gh workflow run "$workflow_id" \
                    --repo "$REPO" \
                    --ref "$head_ref" \
                    || echo "  ❌ Failed to trigger workflow for PR #${pr_number}"

                  echo "  ✅ Triggered workflow for PR #${pr_number}"
                else
                  echo "  ⚠️  Could not find flywheel workflow to trigger for PR #${pr_number}"
                fi
              else
                echo "  ✓ Recent flywheel activity found (${recent_checks} check runs). Skipping."
              fi
            else
              echo "PR #${pr_number} is recent (last updated: ${updated_at}). Skipping."
            fi
          done

          echo "Nightly babysitter run complete."
